[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "smartclass-buct"
version = "0.2.0"
description = "北化课堂录播桌面工作台：下载、转写、课件 OCR 与课堂笔记"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31",
    "playwright>=1.40",
    "Pillow>=10",
    "flask>=3.1",
    "markdown-it-py>=3.0",
    "tomlkit>=0.13",
    "filelock>=3.13",
    "PySide6-Addons>=6.7,<7",
]

[project.scripts]
scls = "smartclass.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
smartclass = ["web/templates/*.html", "web/static/*.css", "web/static/*.js", "desktop/icons/*.svg", "desktop/*.qss"]
