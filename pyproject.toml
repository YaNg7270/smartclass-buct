[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "smartclass-buct"
version = "0.2.0"
description = "北化 smartclass 录播课：批量下载课件视频、GPU 加速瘦身、语音转写、课件 OCR、作业与笔记归纳、本机 Web 界面"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31",
    "playwright>=1.40",
    "Pillow>=10",
    "flask>=3.1",
    "markdown-it-py>=3.0",
]

[project.scripts]
scls = "smartclass.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
smartclass = ["web/templates/*.html", "web/static/*.css", "web/static/*.js"]
