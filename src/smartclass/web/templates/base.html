<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}scls 课堂包{% endblock %}</title>
<link rel="stylesheet" href="{{ url_for('static', filename='app.css') }}">
</head>
<body>
<header class="topbar">
  <a class="brand" href="/">scls 课堂包</a>
  <nav class="nav">
    <a href="{{ url_for('index') }}">首页</a>
    {% block nav %}{% endblock %}
  </nav>
  <form class="searchbox" action="/search" method="get">
    <input type="search" name="q" placeholder="全文搜索（转写 / 课件 / 笔记）" value="{{ request.args.get('q', '') }}">
    <button type="submit">搜索</button>
  </form>
  <span id="job-dot" class="dot idle" title="任务状态"></span>
</header>

<div id="banner"></div>

<main class="content">
{% block content %}{% endblock %}
</main>

<footer class="foot">scls 本机界面 · 仅 127.0.0.1 可访问</footer>
<script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
